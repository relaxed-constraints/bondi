site_name: Database Research Toolkit
site_description: Python building blocks for reproducible database research
watch:
  - src
nav:
  - Overview: index.md
  - Guides:
      - Local databases: local-databases.md
      - Collection reference: collection-reference.md
      - Find query: find-query.md
      - Aggregation query: aggregate-query.md
      - Couchbase query: couchbase-query.md
      - Inspecting schemas: schemas.md
      - Queries and workloads: workloads.md
      - Async MongoDB executor: executor.md
      - Async Couchbase executor: couchbase-executor.md
      - MongoDB explain summaries: explain.md
      - Couchbase query summaries: couchbase-summaries.md
  - Documentation walkthrough: documentation.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
