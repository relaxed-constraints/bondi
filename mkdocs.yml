site_name: BONDI
site_url: https://relaxed-constraints.github.io/bondi/
repo_url: https://github.com/relaxed-constraints/bondi
repo_name: relaxed-constraints/bondi
copyright: Copyright &copy; 2026 Relaxed Constraints
site_description: A Python toolkit for document database research
theme:
  name: material
  font: false
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
watch:
  - src
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Local databases: local-databases.md
      - Quickstart: quickstart.md
  - User guide:
      - Queries and workloads:
          - MongoDB queries: find-query.md
          - Couchbase queries: couchbase-query.md
          - Building and saving workloads: workloads.md
      - Query execution:
          - Running queries and workloads: executor.md
          - Explain and profile: profiling.md
          - Query summaries: summaries.md
      - Schema inspection: schemas.md
      - Cardinality estimation: mongodb-estimation.md
      - Workload generation: workload-generation.md
  - Tutorials:
      - Inspect a dataset: tutorials/inspect-data.md
      - Generate and evaluate a workload: tutorials/generate-workload.md
      - Explore Couchbase: tutorials/couchbase.md
  - API reference:
      - Overview: api.md
      - Queries and workloads: reference/queries.md
      - Results and summaries: reference/results.md
      - Schema inspection: reference/schema.md
      - Estimation interfaces: reference/estimation.md
      - MongoDB:
          - Queries: reference/mongodb/queries.md
          - Executors: reference/mongodb/executors.md
          - Sampling estimation: reference/mongodb/estimation.md
          - Workload generation: reference/mongodb/generation.md
          - Summary parsing: reference/mongodb/summaries.md
      - Couchbase:
          - Queries: reference/couchbase/queries.md
          - Executors: reference/couchbase/executors.md
          - Summary parsing: reference/couchbase/summaries.md
  - Development:
      - Contributing: contributing.md
      - Architecture and design: architecture.md
      - Building the documentation: documentation.md
      - Roadmap: roadmap.md
      - Releases: releases.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
