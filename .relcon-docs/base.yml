# Managed by relcon-docs configure. Do not edit this file.
# Put project overrides in mkdocs.yml. Paths are relative to that file.
extra_css:
- stylesheets/relcon-docs.css
extra_javascript:
- javascripts/relcon-docs-math.js
theme:
  variant: modern
  font: false
  features:
  - content.action.copy
  - content.tabs.link
  - content.code.copy
  - navigation.tabs
  - navigation.top
  - search.highlight
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: lucide/moon
      name: Switch to system preference
markdown_extensions:
  pymdownx.arithmatex:
    generic: true
  admonition: {}
  pymdownx.details: {}
  pymdownx.highlight: {}
  pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: pymdownx.superfences.fence_code_format
  pymdownx.tabbed:
    alternate_style: true
plugins:
  llmstxt:
    sections:
      Documentation: ["*.md"]
  search: {}
  mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          members_order: alphabetical
          filters: ["!^_"]
          show_signature_annotations: true
          separate_signature: true
          signature_crossrefs: true
          line_length: 76
