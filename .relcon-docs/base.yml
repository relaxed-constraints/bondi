# Shared documentation defaults; maintained here until relcon-docs is packaged.
# Paths are relative to the project configuration, not this directory.
extra_css:
- stylesheets/markdown-copy.css
theme:
  variant: modern
  font: false
  features:
  - content.action.copy
  - content.tabs.link
  - content.code.copy
  - navigation.tabs
  - navigation.top
  - search.highlight
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: lucide/moon
      name: Switch to system preference
markdown_extensions:
  pymdownx.highlight: {}
  pymdownx.superfences: {}
  pymdownx.tabbed:
    alternate_style: true
plugins:
  search: {}
  mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          show_signature_annotations: true
          separate_signature: true
          signature_crossrefs: true
          line_length: 76
