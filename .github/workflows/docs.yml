# Project-owned: deploy only when a GitHub release is published.
name: Documentation
on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: relaxed-constraints/relcon-docs/.github/workflows/deploy-docs.yml@ea4aa3ded66f09a8963a5f12655f9e601e286400
