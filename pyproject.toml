[project]
name = "bondi"
version = "0.1.1"
description = "A Python toolkit for document database research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Relaxed Constraints"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.13,<5",
]

[project.urls]
Homepage = "https://github.com/relaxed-constraints/bondi"
Documentation = "https://relaxed-constraints.github.io/bondi/"
Repository = "https://github.com/relaxed-constraints/bondi"
Issues = "https://github.com/relaxed-constraints/bondi/issues"
Changelog = "https://github.com/relaxed-constraints/bondi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
couchbase = ["couchbase>=4.6.3,<5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bondi"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/bondi"]
addopts = "--import-mode=importlib --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]
