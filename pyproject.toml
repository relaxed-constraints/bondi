[project]
name = "bondi"
version = "0.1.0"
description = "A Python toolkit for document database research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.13,<5",
]

[project.optional-dependencies]
couchbase = ["couchbase>=4.6.3,<5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bondi"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/bondi"]
addopts = "--import-mode=importlib --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
