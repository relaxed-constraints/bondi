[project]
name = "bondi"
version = "0.2.0"
description = "A Python toolkit for document database research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Relaxed Constraints"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.13,<5",
]

[project.scripts]
bondi = "bondi._cli:main"

[project.urls]
Homepage = "https://github.com/relaxed-constraints/bondi"
Documentation = "https://relaxed-constraints.github.io/bondi/"
Repository = "https://github.com/relaxed-constraints/bondi"
Issues = "https://github.com/relaxed-constraints/bondi/issues"
Changelog = "https://github.com/relaxed-constraints/bondi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
data = ["datasets>=3,<5", "huggingface-hub>=0.24,<2", "ijson>=3,<4", "pyarrow>=17"]
couchbase = ["couchbase>=4.6.3,<5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
docs = [
    "ruff>=0.9",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bondi"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/bondi"]
addopts = "--import-mode=importlib --doctest-modules"
markers = ["live: opt-in Docker integration tests using isolated BONDI deployments"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]
